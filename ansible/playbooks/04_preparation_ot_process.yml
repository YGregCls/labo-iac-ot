---
- name: Preparation de la machine OT-PROCESS
  hosts: process
  become: true

  tasks:

    - name: Installer les outils de developpement
      ansible.builtin.apt:
        name:
          - git
          - curl
          - wget
          - build-essential
          - cmake
          - python3-pip
          - python3-venv
        state: present
        update_cache: true
        cache_valid_time: 3600
